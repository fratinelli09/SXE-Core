# Builds SXE Core and runs the CTest tests on Linux and Windows on every push and pull request.
#
# The golden tests compare results to the cent with references generated on Linux arm64.
# The build uses -ffp-contract=off (no fused multiply-add) and MSVC does not fuse either, so
# the same references should hold on every platform.
#
# When a release is published, the Windows job also attaches a ready-to-use zip to it:
# SXE.exe, SXE.dll + SXE.lib + sxe.h (C interface), the CMake package (cmake/), the engine DLLs,
# the Template strategy, the example configuration, the test data, sxe.py (Python) and the
# licences (SXE Core and inih).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# the Python tests and their pandas checks are required in CI (skipped elsewhere when Python or
# pandas is missing)
env:
  SXE_REQUIRE_PYTHON: 1
  SXE_REQUIRE_PANDAS: 1

jobs:
  test:
    name: Build and test (Linux arm64, GCC 14)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ cmake make ca-certificates git python3 python3-pandas

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: ./comp_All.sh test

  windows:
    name: Build and test (Windows x64, MSVC)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Python packages
        run: python -m pip install pandas

      - name: Build
        run: |
          cmake -S . -B CMakeWork -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$((Get-Command python).Source)"
          cmake --build CMakeWork

      - name: Test
        run: ctest --test-dir CMakeWork --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/SXE-Core"
          cmake --install CMakeWork --prefix $dist
          New-Item -ItemType Directory -Force "$dist/Data" | Out-Null
          Copy-Item file/Tests/Data/BTCUSDT_1h_2023_2024.csv, file/Tests/Data/BTCUSDT_funding_2023_2024.csv "$dist/Data/"
          Copy-Item Target/Config/*.ini "$dist/Config/"
          (Get-Content "$dist/Config/EngineConfig.ini") -replace '^data\s*=.*$', 'data   = ../Data' |
              Set-Content "$dist/Config/EngineConfig.ini"
          Copy-Item LICENSE, README.md, file/Settings/LICENSE_inih.txt "$dist/"
          Compress-Archive -Path $dist -DestinationPath SXE-Core-windows-x64.zip

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: SXE-Core-windows-x64
          path: SXE-Core-windows-x64.zip

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" SXE-Core-windows-x64.zip --clobber
