#==========================================================================
# EngineConfig.ini - SXE Core engine configuration
#
# How to write this file:
#   - paths: relative to the Target/Bin folder (where the SXE executable is)
#     or absolute; "~/" is your home folder
#   - decimal numbers always use the dot: 0.0006 (not 0,0006)
#   - lines starting with # are comments and are ignored
# Changes take effect at the next start of SXE.
#==========================================================================


#--------------------------------------------------------------------------
# [ENGINE] what the engine does
#--------------------------------------------------------------------------
[ENGINE]

# mode: SIM = simulation on historical data, no real orders (see [SIMULATION])
#       REAL is reserved for live trading, not available in this edition
mode   = SIM

# symbol: traded pair, passed to the strategy (e.g. BTCUSDT)
symbol = BTCUSDT


#--------------------------------------------------------------------------
# [STRATEGY] which strategy to run
#--------------------------------------------------------------------------
[STRATEGY]

# folder: folder of the compiled strategies (Strategies = Target/Bin/Strategies)
folder  = Strategies

# library: file name of the strategy, inside folder
#   libTemplate.so = moving-average crossover example
library = libTemplate.so

# config: file with the strategy parameters (usually Target/Config/<name>.ini)
config  = ../Config/Template.ini


#--------------------------------------------------------------------------
# [PATH] folders used by the engine
# A "cycle" goes from the opening of the position to its complete close.
#--------------------------------------------------------------------------
[PATH]

# log: files of the cycle in progress (log.txt, error.txt, orders, strategy files)
log    = ../Log

# backup: when a cycle closes, its log files are moved to
#   <backup>/b<cycle number>, together with a result.txt that summarises it;
#   total_result.txt contains one row per cycle
backup = ../Backup

# data: folder with the historical data (candles and funding) used in SIM mode.
#   data_file and funding_file in [SIMULATION] are relative to this folder.
#   The repository ships two years of BTCUSDT data (2023-2024) in file/Tests/Data
data   = ../../file/Tests/Data


#--------------------------------------------------------------------------
# [EXCHANGE] contract rules (Bitget values, BTCUSDT perpetual futures)
# In SIM they drive the simulated orders; the strategy also receives them.
#--------------------------------------------------------------------------
[EXCHANGE]

# margin_mode: what backs the position
#   isolated = only the margin put in the position: a liquidation loses that margin
#   crossed  = the whole account balance: a liquidation loses the whole account
margin_mode        = isolated

# fee_taker: fee on every market order, as a fraction of the order value
#   0.0006 = 0.06%: on a 10,000 USDT position, 6 USDT to open and 6 to close
fee_taker          = 0.0006

# fee_maker: fee on every limit order when it is filled, as a fraction of the order value
#   0.0002 = 0.02%: on a 10,000 USDT position, 2 USDT to open and 2 to close
fee_maker          = 0.0002

# slippage: how much worse the fill price is than the observed price, as a fraction of the price
#   0.00005 = 0.005%: with BTC at 100,000 you buy at 100,005 and sell at 99,995
slippage           = 0.00005

# maintenance_tiers: maintenance margin, i.e. the minimum margin the position must keep:
#   when losses leave less than this (plus the closing fee) the position is liquidated.
#   Tiers "limit:rate" separated by commas (limit = position value in USDT).
#   Each slice of the position pays the rate of its tier. E.g. with
#   200000:0.004, 1000000:0.005 a 330,000 USDT position must keep
#   200,000 x 0.4% + 130,000 x 0.5% = 800 + 650 = 1,450 USDT.
#   Above the last limit the last rate applies. Bitget BTCUSDT values (October 2026).
#   The list can span several lines: continuation lines must start with spaces
#   (each line of the file can be at most 200 characters long)
maintenance_tiers  = 200000:0.004, 1000000:0.005, 5000000:0.007, 15000000:0.01,
                     50000000:0.02, 100000000:0.03, 150000000:0.06, 300000000:0.12,
                     500000000:0.15, 700000000:0.2, 900000000:0.3, 1200000000:0.6

# qty_step: the quantity of every order is rounded down to a multiple of this (BTC)
qty_step           = 0.0001

# min_qty: minimum quantity of an order (BTC)
min_qty            = 0.0001

# min_notional: minimum value of an order (USDT): smaller orders are rejected
min_notional       = 5


#--------------------------------------------------------------------------
# [SIMULATION] used only with mode = SIM
#--------------------------------------------------------------------------
[SIMULATION]

# PERIOD TO SIMULATE, both ends included.
#   Formats: YYYY-MM-DD (one day) or YYYY-MM (the whole month)
#   Empty = from the start of the data / to the end of the data
#   Examples: January 2023 to October 2025       start_date = 2023-01      end_date = 2025-10
#             15 March 2024 to the end of year    start_date = 2024-03-15   end_date = 2024-12-31
start_date      =
end_date        =

# initial_capital: account balance at the start of the simulation (USDT)
initial_capital = 5000

# data_file: price history, one row per candle (date;time;open;high;low;close;volume),
#   inside the [PATH] data folder. The candle duration sets the precision:
#   5-minute candles are more precise but slower than 1-hour candles
data_file       = BTCUSDT_1h_2023_2024.csv

# funding_file: funding history (timestamp,funding_rate), inside the [PATH] data folder.
#   On perpetual futures, every 8 hours (00:00, 08:00, 16:00 UTC) longs pay shorts a small
#   % of the position value (or receive it when the rate is negative). Empty = always funding_rate
funding_file    = BTCUSDT_funding_2023_2024.csv

# funding_rate: rate used where the history is missing
#   0.0001 = 0.01% of the position value every 8 hours: 1 USDT every 8 hours on 10,000 USDT
funding_rate    = 0.0001

# funding_multiplier: multiplies every funding payment (historical or funding_rate), for stress tests
#   1 = real funding, 2 = twice the funding at every 8-hour payment
#   (funding received when the rate is negative is doubled as well)
funding_multiplier = 2

# intrabar: how the price moves inside each candle (the strategy sees every intermediate price)
#   0 = close price only
#   1 = rising candle:  open -> low -> high -> close
#       falling candle: open -> high -> low -> close
#   2 = always the low first, 3 = always the high first:
#       running both 2 and 3 shows the best and the worst case for the strategy
intrabar        = 1

# tick_step: intermediate prices are added between two distant points of the candle every tick_step
#   0.002 = one price every 0.2% of movement (0 = no intermediate prices)
tick_step       = 0.002

# liquidation: 1 = positions are liquidated as the exchange would do, 0 = never liquidated
#   (with 0 the account can even go below zero: useful only for comparisons)
#   isolated: the position margin is lost and the simulation continues with the rest
#   crossed:  the whole account is lost and the simulation stops
liquidation     = 1

# limit_fill: when a limit order is filled (always at its own price, with fee_maker)
#   through = the price must go past the limit by tick_step (0.2%: a buy limit at 100,000
#             is filled when the price reaches 99,800). On a real exchange other orders may
#             be queued at the same price: a limit that is only touched may stay unfilled
#   touch   = filled as soon as the price reaches the limit (optimistic)
limit_fill      = through

# resume: 0 = every start begins from start_date with initial_capital
#         1 = continues from where the last simulation stopped (state_file),
#             with the same data_file; useful after an interruption (Ctrl+C)
resume          = 0

# state_file: where the engine saves the point reached, the account and the position (for resume = 1)
state_file      = ../Log/last_row.txt

# save_every: how many candles between two saves of state_file (also saved at every order and at the end)
save_every      = 500

# order_log: list of the orders of the cycle in progress (moved to the cycle backup when it closes)
order_log       = ../Log/Set_Close_log.txt


#--------------------------------------------------------------------------
# [LOG] what to write in Target/Log/log.txt (1 = yes, 0 = no)
#--------------------------------------------------------------------------
[LOG]

# info: normal progress (start, orders, cycles). With 0 the log contains only warnings and errors
info    = 1

# warning: problems handled automatically (missing data, rejected order, ...)
warning = 1

# error: serious problems (also written to Target/Log/error.txt)
error   = 1

# console: 1 = show on the terminal a line that updates with date, price and equity
console = 1
