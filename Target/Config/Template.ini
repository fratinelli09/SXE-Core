#==========================================================================
# Template.ini - parameters of the example strategy "Template"
#
# What it does: compares two moving averages of the candle close prices
#   - the "fast" average (last fast_period candles) crosses ABOVE the "slow" one
#     (last slow_period candles): the price is rising -> opens a long position
#   - the fast average crosses back BELOW the slow one: the price is falling -> closes the position
# It is an example and a check that the engine works, not a strategy to make money.
# Decimal numbers use the dot. Changes take effect at the next start.
#==========================================================================

[TEMPLATE]

# fast_period: number of candles of the fast average (with 1-hour candles: 20 = last 20 hours)
fast_period = 20

# slow_period: number of candles of the slow average, must be greater than fast_period
slow_period = 50

# order_perc: % of the available balance used as margin at every opening
#   50 = half of the balance: with 5,000 USDT available, 2,500 USDT are used
order_perc  = 50

# leverage: position leverage. Position = margin x leverage
#   1 = no leverage: 2,500 USDT of margin buy 2,500 USDT of BTC
leverage    = 1
