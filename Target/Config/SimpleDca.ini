#==========================================================================
# SimpleDca.ini - parameters of the example strategy "SimpleDca"
#
# What it does (dollar-cost averaging, long only):
#   - at the close of a candle with no position, buys the base order
#   - every time the price falls another step_perc below that first entry, buys a safety
#     order, each one size_mult times the previous one: the average price goes down
#   - when the price is take_profit_perc above the average price, closes everything;
#     the next cycle starts at the next candle close
# It is the strategy of the case study (docs/case_study.md): an example, not a strategy to
# make money. Decimal numbers use the dot. Changes take effect at the next start.
#==========================================================================

[SIMPLE_DCA]

# budget_perc: % of the available balance that a whole cycle may use as margin
#   (base order + every safety order). 95 leaves room for the fees
budget_perc      = 95

# safety_orders: how many orders can be added below the first entry (0 = only the base order)
safety_orders    = 4

# step_perc: distance between the safety levels, in % of the first entry price
#   3 = safety orders at -3%, -6%, -9%, -12% from the first entry
step_perc        = 3

# size_mult: each safety order is size_mult times the previous one
#   1.5 with 4 safety orders: margins 1, 1.5, 2.25, 3.375, 5.06 (base = 1/13.19 of the budget)
size_mult        = 1.5

# take_profit_perc: closes the position when the price is this % above the average price
take_profit_perc = 1.5

# leverage: leverage of every order. Position = margin x leverage
leverage         = 3
